<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демо Moodle - Главная</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Демонстрация Тестов (Имитация Moodle)</h1>
        <p>Выберите, как вы хотите пройти тест. Вопросы в обоих тестах одинаковые.</p>

        <div class="button-group">
            <a href="test1.html" class="button primary-button">Пройти Тест (в том же окне)</a>

            <a href="#" class="button secondary-button" onclick="openMiniWindow(event)">Пройти Тест (в новом мини-окне)</a>
        </div>

        <p class="note">⚠️ Это статичный макет. Ответы не сохраняются и не проверяются.</p>
    </div>

    <script>
        function openMiniWindow(event) {
            // Отменяем стандартное действие ссылки
            event.preventDefault(); 
            
            // Параметры для окна:
            // width, height - размеры окна
            // menubar=no, toolbar=no, location=no, status=no - убирает элементы браузера
            const windowFeatures = "width=850,height=700,resizable=yes,scrollbars=yes,menubar=no,toolbar=no,location=no,status=no";

            // Открываем test2.html в новом окне с заданными параметрами
            window.open('test2.html', 'TestWindow', windowFeatures);
        }
    </script>
</body>
</html>
